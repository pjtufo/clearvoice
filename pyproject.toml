[project]
name = "clearvoice"
version = "0.1.0"
description = "ClearVoice - 音视频噪声消除 / 分割 / 合并 / 时间轴处理工具"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.6,<6.10",
    "numpy>=1.24,<2.3",
    "scipy>=1.10",
    "soundfile>=0.12",
    "noisereduce>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 可选：魔塔(ModelScope)在线小模型 —— 语音识别 / 语音增强 / 翻译 / 语音合成
modelscope = [
    "funasr>=1.1",
    "modelscope>=1.17",
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40,<5",
    "edge-tts>=6.1",
]

[tool.uv]
package = false
